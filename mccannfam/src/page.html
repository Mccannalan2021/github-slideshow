<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mccannfam</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5b6573; --line: #dde1e6;
    --accent: #0b5cad; --accent-text: #fff; --good: #1d7a3a; --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1f25; --text: #e7eaee; --muted: #9aa4b1; --line: #2c333c;
      --accent: #5aa2f0; --accent-text: #0b1520; --good: #5cc27e; --chip: #232a33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
  label.check { flex-direction: row; align-items: center; gap: 6px; font-size: 14px; color: var(--text); }
  input, select, button, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
  .stats { color: var(--muted); font-size: 13px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .job h2 { font-size: 16px; margin: 0 0 2px; }
  .job h2 a { color: var(--accent); text-decoration: none; }
  .meta { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .chip.good { color: var(--good); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions a, .actions button { font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--text); text-decoration: none; background: var(--card); }
  .reply { width: 100%; min-height: 160px; margin-top: 8px; }
  .msg { padding: 10px 12px; border-radius: 8px; background: var(--chip); margin-bottom: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>mccannfam</h1>
  <div class="sub" id="sourcesLine">Every source in one search</div>
</header>
<main>
  <div id="keyBox" class="msg hidden">
    <label>API key (from your .env file)
      <input id="apiKey" type="password" autocomplete="off">
    </label>
    <div style="margin-top:8px"><button class="primary" id="saveKey">Save key</button></div>
  </div>

  <form id="search">
    <label>Keywords <input name="q" placeholder="driver, nurse, welder..."></label>
    <label>Near <select name="near" id="near"></select></label>
    <label>City <select name="city" id="city"><option value="">Any</option></select></label>
    <label>Region <select name="region" id="region"><option value="">Any</option></select></label>
    <label>Type <select name="type" id="type"><option value="">Any</option></select></label>
    <label>Min pay ($/year) <input name="minSalary" type="number" step="5000" min="0"></label>
    <label>Posted within <select name="postedWithin"><option value="">Any time</option><option value="1">1 day</option><option value="3">3 days</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></label>
    <label>Sort <select name="sort"><option value="relevance">Closest first</option><option value="date">Newest</option><option value="salary">Highest pay</option><option value="match">Best resume match</option></select></label>
    <label class="check"><input type="checkbox" name="hasEmail" value="true"> Has apply email</label>
    <button class="primary" type="submit">Search</button>
  </form>

  <div class="bar">
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button id="csv" type="button">Download CSV</button>
      <button id="more" type="button" class="hidden">Load more</button>
    </div>
  </div>
  <div id="error" class="msg hidden"></div>
  <div id="results"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let page = 1;
let lastParams = null;

// Only http(s) links: a javascript: URL from a job source would run on click.
const safeUrl = (u) => (/^https?:\/\//i.test(String(u || '')) ? u : '#');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'content-type': 'application/json', 'x-api-key': store.get('apiKey') || '', ...(options.headers || {}) } });
  if (res.status === 401) { $('keyBox').classList.remove('hidden'); throw new Error('Enter your API key to continue.'); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Request failed (${res.status})`);
  return res;
}

function showError(err) {
  $('error').textContent = err.message;
  $('error').classList.remove('hidden');
}

function params() {
  const p = new URLSearchParams();
  for (const [k, v] of new FormData($('search'))) if (v) p.set(k, v);
  return p;
}

function jobCard(j) {
  const posted = j.postedAt ? new Date(j.postedAt).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }) : '';
  const chips = [
    j.proximity === 'city' ? '<span class="chip good">In town</span>' : j.proximity === 'region' ? '<span class="chip">Nearby</span>' : '',
    j.type ? `<span class="chip">${esc(j.type)}</span>` : '',
    j.salary ? `<span class="chip">${esc(j.salary)}</span>` : '',
    j.remote ? '<span class="chip">Remote</span>' : '',
    j.applyEmail ? '<span class="chip good">Apply by email</span>' : '',
    j.match ? `<span class="chip">Match ${j.match.score}%</span>` : '',
    posted ? `<span class="chip">Posted ${esc(posted)}</span>` : '',
  ].join('');
  return `<article class="job" data-id="${esc(j.id)}">
    <h2><a href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener">${esc(j.title)}</a></h2>
    <div class="meta">${esc(j.company)}${j.company ? ' · ' : ''}${esc(j.location)} · ${esc(j.source)}</div>
    <div class="chips">${chips}</div>
    <div class="actions">
      <a href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener">Open posting</a>
      ${j.applyEmail ? `<a href="mailto:${esc(j.applyEmail)}">${esc(j.applyEmail)}</a>` : ''}
      ${j.applyPhone ? `<a href="tel:${esc(j.applyPhone)}">${esc(j.applyPhone)}</a>` : ''}
      <button type="button" data-reply="${esc(j.id)}">Write quick reply</button>
    </div>
    <div class="reply-box"></div>
  </article>`;
}

async function runSearch(append = false) {
  $('error').classList.add('hidden');
  if (!append) { page = 1; lastParams = params(); }
  const p = new URLSearchParams(lastParams);
  p.set('page', page);
  p.set('limit', 25);
  try {
    const data = await (await api(`/jobs?${p}`)).json();
    const html = data.jobs.map(jobCard).join('');
    $('results').innerHTML = append ? $('results').innerHTML + html : html || '<div class="msg">No jobs match. Try fewer filters.</div>';
    const f = data.facets;
    $('stats').textContent = `${data.total.toLocaleString()} jobs · ${f.withApplyEmail} with an apply email · median pay ${f.salary.medianMin ? '$' + f.salary.medianMin.toLocaleString() + '/yr' : 'n/a'}`;
    $('more').classList.toggle('hidden', page >= data.pages);
    const failed = data.sources.filter((s) => !s.ok);
    if (failed.length) showError(new Error(`Some sources failed: ${failed.map((s) => `${s.name} (${s.error})`).join(', ')}`));
  } catch (err) { showError(err); }
}

$('results').addEventListener('click', async (e) => {
  const id = e.target.dataset.reply;
  if (!id) return;
  const box = e.target.closest('.job').querySelector('.reply-box');
  try {
    const r = await (await api(`/jobs/${encodeURIComponent(id)}/quick-reply`, { method: 'POST', body: JSON.stringify({ type: 'apply' }) })).json();
    box.innerHTML = `<textarea class="reply">${esc(r.message)}</textarea>
      <div class="actions">
        <button type="button" data-copy>Copy</button>
        ${r.mailto ? `<a href="${esc(r.mailto)}">Send by email</a>` : `<a href="${esc(safeUrl(r.applyUrl))}" target="_blank" rel="noopener">Apply on posting</a>`}
      </div>`;
    box.querySelector('[data-copy]').onclick = () => navigator.clipboard?.writeText(box.querySelector('textarea').value);
  } catch (err) {
    box.innerHTML = `<div class="msg">${esc(err.message)}${/resume/i.test(err.message) ? ' (PUT /resume first)' : ''}</div>`;
  }
});

$('csv').onclick = async () => {
  try {
    const blob = await (await api(`/jobs.csv?${params()}`)).blob();
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'mccannfam-jobs.csv' });
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (err) { showError(err); }
};

$('more').onclick = () => { page++; runSearch(true); };
$('search').onsubmit = (e) => { e.preventDefault(); runSearch(); };
$('saveKey').onclick = () => { store.set('apiKey', $('apiKey').value.trim()); $('keyBox').classList.add('hidden'); init(); };

async function init() {
  try {
    const health = await (await fetch('/health')).json();
    const sources = await (await api('/sources')).json();
    $('sourcesLine').textContent = `Sources: ${sources.map((s) => s.jobs ? `${s.name} (${s.jobs.toLocaleString()} jobs)` : s.name).join(', ')}`;
    const meta = await (await api('/alberta/cities')).json();
    const cities = meta.regions.flatMap((r) => r.cities).sort();
    $('near').innerHTML = '<option value="">None</option>' + cities.map((c) => `<option ${c === health.homeCity ? 'selected' : ''}>${esc(c)}</option>`).join('');
    $('city').innerHTML = '<option value="">Any</option>' + cities.map((c) => `<option>${esc(c)}</option>`).join('');
    $('region').innerHTML = '<option value="">Any</option>' + meta.regions.map((r) => `<option>${esc(r.name)}</option>`).join('');
    $('type').innerHTML = '<option value="">Any</option>' + meta.jobTypes.map((t) => `<option>${esc(t)}</option>`).join('');
    runSearch();
  } catch (err) { showError(err); }
}
init();
</script>
</body>
</html>
