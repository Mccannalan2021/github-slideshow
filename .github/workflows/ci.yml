name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Pinned (not ubuntu-latest): ruby/setup-ruby only has prebuilt 3.3.4 for ubuntu-22.04/24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          # The Ruby that GitHub Pages builds with (github-pages 232).
          ruby-version: "3.3.4"
          # Installs the gems from Gemfile.lock and caches them.
          bundler-cache: true
      - name: Build the site and check it with html-proofer
        run: script/cibuild
